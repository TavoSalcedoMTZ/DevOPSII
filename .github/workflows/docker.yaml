name: Buildear Image

on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  revisar:
    name: Lint y Construccion
    runs-on: ubuntu-latest

    steps:
     - name: Importar Checkout
       uses: actions/checkout@v4

     - name: Lint de la receta
       uses: hadolint/hadolint-action@v3.4.0
       with:
         dockerfile: Dockerfile
  
  construir:
    name: construir
    needs: revisar
    runs-on: ubuntu-latest

    steps:
     - name: construir Imagen
       uses: actions/checkout@v4
       run: docker build -t etiqueta .

    
  
  
